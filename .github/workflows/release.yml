name: Release

on:
  push:
    tags:
      - 'v*'

# id-token: write lets the npm publish step use OIDC (trusted publishing,
# no long-lived npm token). contents: write creates the GitHub Release.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Verify bundle is up to date
        run: |
          node scripts/build.mjs
          git diff --exit-code -- lib/client.js || (echo "lib/client.js is stale — run npm run build and commit"; exit 1)
      - name: Run tests
        run: npm test
      - name: Sync package version to tag
        # npm pack names the tarball from package.json's version; keep it
        # aligned with the git tag (vX.Y.Z -> X.Y.Z) so release assets match.
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
      - name: Build release tarball
        run: npm pack
      - name: Compute SHA-256 checksum
        run: sha256sum dsh-plugin-hot-toggle-*.tgz > SHA256SUMS.txt
      # npm trusted publishing (OIDC): the npm CLI detects the GitHub OIDC
      # environment automatically and exchanges it for a short-lived publish
      # token — no NPM_TOKEN secret, no manual OTP, with provenance attached.
      # Requires the trusted publisher configured on npmjs.com for this repo
      # (workflow release.yml, allowed action: npm publish).
      # NODE_AUTH_TOKEN is left unset; the CLI falls back to OIDC. The env
      # var is declared defensively so a future token-based setup still works.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ''
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-plugin-hot-toggle ${{ github.ref_name }}
          body: |
            ## dsh-plugin-hot-toggle ${{ github.ref_name }}

            Install from npm:
            ```sh
            dsh plugin --profile web add dsh-plugin-hot-toggle@${{ github.ref_name }}
            ```

            Or from this tarball:
            ```sh
            dsh plugin --profile web add ./dsh-plugin-hot-toggle-${{ github.ref_name }}.tgz
            ```

            > This release was published to npm via OIDC trusted publishing
            > with provenance (no token, no manual 2FA).
          files: |
            dsh-plugin-hot-toggle-*.tgz
            SHA256SUMS.txt
