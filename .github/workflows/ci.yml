name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependency install: build and tests are zero-dependency by design
      # (scripts/build.mjs and the test suite use only Node built-ins).
      - name: Build client bundle
        run: node scripts/build.mjs
      - name: Verify bundle is up to date
        run: |
          node scripts/build.mjs
          git diff --exit-code lib/client.js || (echo "lib/client.js is stale — run npm run build and commit"; exit 1)
      - name: Run tests
        run: npm test
